name: CI

# Проверки, которые ловят класс багов этапа 2.5:
#   go       — компиляция, формат, vet, тесты (включая гонку в лимитере);
#   frontend — синтаксис каждого JS-файла, целостность подключений (модальные
#              окна T0.1 сломались именно здесь: файл был валидным, но ни одна
#              страница его не подключала) и согласованность документации с деревом
#              (ADR-0025: ссылки на файлы, координаты строк, хеши коммитов, цифры
#              «N строк» и команды npm);
#   parser   — приложенный Python-парсер: синтаксис, его собственный тест и
#              договор с Go-мостом по фикстурам живого ответа;
#   ui       — jsdom-тесты против живого сервера, сквозная проверка источника
#              расписания на подставном парсере и шесть конфигураций источника
#              на собранном сервере.
#
# Живой АПЭКС-ВУЗ из CI не дёргается: для этого нужен токен вуза, а публиковать
# его в настройках репозитория смысла нет — доступ выдаётся на время. Всё, что
# можно проверить без сети, проверяется на срезах ответа (internal/apeks/testdata).
#
# Миграции на чистой PostgreSQL появляются вместе с T2.1: сейчас схема применяется
# кодом на SQLite (internal/database/db.go), отдельного SQL-пакета для dry-run нет.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Новый пуш в ту же ветку отменяет предыдущий прогон: проверки дешёвые,
# очереди — дорогие.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (gofmt, vet, build, test -race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Установка Go (версия из go.mod)
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # Тест паритета каталога (TestPythonGroupsMatchGoParser) вызывает python3 и
      # молча пропускается, если интерпретатора нет. Чтобы «зелёный» CI означал
      # именно проверенный паритет, интерпретатор ставится здесь же.
      - name: Установка Python (для проверки паритета разборов)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt требует правок в файлах:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test -race -count=1 ./...

  frontend:
    name: Фронтенд без сборки (node --check + связи HTML/JS) и согласованность docs
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 — полная история. Нужна проверке документации: она сверяет
      # каждое `abc1234` в docs с реальным коммитом, а в shallow-клоне этих объектов
      # нет (сам скрипт в таком случае пропускает группу и печатает об этом строку,
      # но зелёный прогон без хешей — прогон неполный).
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Установка Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: node --check по всем web/js/**/*.js
        run: |
          set -e
          # find, а не glob web/js/*.js: с T3.1 часть скриптов лежит в web/js/core,
          # и не-рекурсивная проверка молча пропускала бы подпапку.
          found=0
          while IFS= read -r f; do
            found=$((found + 1))
            echo "-- $f"
            node --check "$f"
          done < <(find web/js -name '*.js' | sort)
          if [ "$found" -eq 0 ]; then
            echo "в web/js нет ни одного .js — проверка сломалась, а не проект"
            exit 1
          fi
          echo "проверено файлов: $found"

      - name: Целостность фронтенда
        run: node scripts/check-frontend.mjs

      # ADR-0025: документация — самый правимый artifact и единственный без проверки.
      - name: Согласованность документации (пути, строки, хеши, объёмы, команды)
        run: node scripts/check-docs.mjs

  parser:
    name: Парсер расписания (Python, офлайн)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # requests не ставится: офлайн-проверкам он не нужен, а живой запрос из CI
      # не делается (см. шапку файла). Установка пакета только маскировала бы тот
      # факт, что граница процесса проверяется без него.
      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Синтаксис всех модулей парсера
        run: python3 -m py_compile tools/schedule-parser/*.py

      - name: Тест разбора из приложенного архива
        working-directory: tools/schedule-parser
        run: python3 test_parser.py

      - name: Договор CLI с Go-мостом
        run: python3 tools/schedule-parser/test_contract.py

  ui:
    name: UI против живого сервера (jsdom)
    runs-on: ubuntu-latest
    needs: [go, frontend]
    env:
      # Одноразовый пароль CI-контейнера, не секрет: база создаётся в раннере
      # и удаляется вместе с ним. В репозитории лежать нельзя только настоящим
      # учётным данным.
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: ci-only-pass-123
    steps:
      - uses: actions/checkout@v4

      - name: Установка Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Установка Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: tests/ui/package-lock.json

      - name: Сборка сервера
        run: go build -o /tmp/sos-ci ./cmd/server

      - name: Зависимости UI-тестов
        working-directory: tests/ui
        run: npm ci

      - name: Запуск сервера
        run: |
          set -e
          /tmp/sos-ci > /tmp/sos-ci.log 2>&1 &
          echo "$!" > /tmp/sos-ci.pid
          for i in $(seq 1 30); do
            if curl -sf localhost:8080/api/health > /dev/null; then
              echo "сервер поднялся"
              exit 0
            fi
            sleep 1
          done
          echo "сервер не поднялся за 30 секунд"
          cat /tmp/sos-ci.log
          exit 1

      - name: Наполнение данными
        run: bash tests/ui/seed.sh

      - name: Прогон UI
        working-directory: tests/ui
        run: npm run test:all

      # Отдельный сервер, отдельная база, отдельный порт: раннер сам всё это
      # поднимает и убирает. Python для шага не нужен — дочерним процессом
      # выступает /bin/sh с подставным парсером, поэтому шаг стоит здесь, а не
      # в job parser.
      - name: Источник расписания на подставном парсере (мост -> база -> страница)
        run: bash tests/schedule-source-python.sh

      # Тот же слой, что нашёл противоречие `configured: true` + `missing_config:
      # APEKS_TOKEN` руками (поправка к ADR-0023): теперь прогон собранного сервера
      # по всем состояниям источника. Своего живого источника не требует — только
      # скомпилированный бинарник, node для разбора JSON и curl.
      - name: Состояния источника расписания (живой сервер, шесть конфигураций)
        run: bash tests/source-states-smoke.sh

      - name: Лог сервера при падении
        if: failure()
        run: cat /tmp/sos-ci.log || true

      - name: Остановка сервера
        if: always()
        run: kill "$(cat /tmp/sos-ci.pid)" 2>/dev/null || true
