<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация · SOS</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header class="site-header">
        <div class="container header-row">
            <a href="/" class="brand">
                <span class="brand-mark" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
                </span>
                <span class="brand-text">
                    <span class="brand-title">SOS</span>
                    <span class="brand-sub">Новый аккаунт</span>
                </span>
            </a>
            <nav class="nav">
                <a href="/login" class="btn btn-secondary">Войти</a>
            </nav>
        </div>
    </header>

    <main class="main auth-wrap">
        <section class="panel auth-card">
            <div class="auth-head">
                <span class="section-index">02</span>
                <h1 class="auth-title">Создать аккаунт</h1>
            </div>
            <p class="auth-sub">Пароль хэшируется на сервере, в открытом виде не хранится.</p>

            <form id="authForm" class="form" data-endpoint="/api/auth/register" novalidate>
                <fieldset class="field radio-group">
                    <legend class="field-label">Кто вы</legend>

                    <label class="radio-card">
                        <input type="radio" name="role" value="student" checked>
                        <span class="radio-dot" aria-hidden="true"></span>
                        <span class="radio-body">
                            <span class="radio-title">Студент</span>
                            <span class="radio-desc">Просматривает каталог и записывается на курсы.</span>
                        </span>
                    </label>

                    <label class="radio-card">
                        <input type="radio" name="role" value="teacher">
                        <span class="radio-dot" aria-hidden="true"></span>
                        <span class="radio-body">
                            <span class="radio-title">Преподаватель</span>
                            <span class="radio-desc">Создаёт курсы и ведёт их.</span>
                        </span>
                    </label>
                </fieldset>

                <label class="field">
                    <span class="field-label">Логин</span>
                    <input class="control" type="text" name="username" required
                           minlength="3" maxlength="32" autocomplete="username" placeholder="ivanov">
                    <span class="helper">3–32 символа: буквы, цифры, точка, дефис, подчёркивание.</span>
                </label>

                <label class="field">
                    <span class="field-label">Email</span>
                    <input class="control" type="email" name="email" required
                           autocomplete="email" placeholder="student@example.com">
                </label>

                <label class="field">
                    <span class="field-label">Полное имя</span>
                    <input class="control" type="text" name="full_name" maxlength="100"
                           autocomplete="name" placeholder="Иванов Иван Иванович">
                </label>

                <label class="field">
                    <span class="field-label">Пароль</span>
                    <input class="control" type="password" name="password" required
                           minlength="8" autocomplete="new-password" placeholder="Минимум 8 символов">
                </label>

                <div class="form-actions">
                    <button type="submit" class="btn">
                        Зарегистрироваться
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
                    </button>
                </div>

                <p id="message" class="message hidden" role="status"></p>
            </form>

            <p class="form-foot">Уже есть аккаунт? <a href="/login">Войти</a></p>
        </section>
    </main>

    <script src="/js/common.js"></script>
    <script src="/js/auth.js"></script>
</body>
</html>
