<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет · SOS</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-layout="dashboard" data-brand-sub="Личный кабинет" data-footer-note="Enrollments · assignments · deadlines">
    <header class="site-header"></header>

    <main class="main">
        <div class="container stack">
            <p id="globalMessage" class="message hidden" role="status"></p>

            <section id="myCoursesSection" class="section hidden">
                <div class="section-head">
                    <span class="section-label"><span class="section-index">01</span> Мои курсы</span>
                    <span class="section-rule"></span>
                    <span class="section-note">GET /api/enrollments/mine</span>
                </div>

                <div id="myCourses" class="grid grid-cards">
                    <div class="empty-state">
                        <span class="spinner" aria-hidden="true"></span>
                        <span class="empty-hint">Загрузка…</span>
                    </div>
                </div>
            </section>

            <section class="section">
                <div class="section-head">
                    <span class="section-label"><span class="section-index">02</span> Каталог курсов</span>
                    <span class="section-rule"></span>
                    <button id="refreshBtn" class="btn btn-icon" title="Обновить список" aria-label="Обновить список">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
                    </button>
                </div>

                <div id="courses" class="grid grid-cards">
                    <div class="empty-state">
                        <span class="spinner" aria-hidden="true"></span>
                        <span class="empty-hint">Загрузка курсов…</span>
                    </div>
                </div>
            </section>

            <section id="courseStudentsPanel" class="panel hidden">
                <div class="panel-head">
                    <span class="section-label" id="courseStudentsTitle">Студенты курса</span>
                    <button id="closeStudents" class="btn btn-icon" title="Закрыть" aria-label="Закрыть">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
                    </button>
                </div>
                <div id="courseStudentsList" class="people-list"></div>
            </section>

            <div id="studentNotice" class="alert hidden" role="note">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
                <span>Создание курсов доступно преподавателям. Записывайтесь на курсы из каталога выше.</span>
            </div>

            <section id="createSection" class="panel hidden">
                <div class="section-head">
                    <span class="section-label"><span class="section-index">03</span> Добавить курс</span>
                    <span class="section-rule"></span>
                    <span class="section-note">POST /api/courses</span>
                </div>

                <form id="courseForm" class="form" novalidate>
                    <label class="field">
                        <span class="field-label">Название курса</span>
                        <input class="control" type="text" name="title" required maxlength="200" placeholder="Например: Основы Go">
                    </label>

                    <label class="field">
                        <span class="field-label">Преподаватель</span>
                        <input class="control" type="text" name="teacher" maxlength="200" placeholder="Например: Иванов И.И.">
                        <span class="helper">Если оставить пустым — подставим ваше имя.</span>
                    </label>

                    <label class="field">
                        <span class="field-label">Описание</span>
                        <textarea class="control" name="description" maxlength="2000" rows="4" placeholder="Краткое описание курса"></textarea>
                    </label>

                    <div class="form-actions">
                        <button type="submit" class="btn">
                            Сохранить
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>
                        </button>
                    </div>

                    <p id="message" class="message hidden" role="status"></p>
                </form>
            </section>

            <section class="section">
                <div class="section-head">
                    <span class="section-label"><span class="section-index">04</span> Аккаунт и доступ</span>
                    <span class="section-rule"></span>
                    <span class="section-note">POST /api/auth/change-password · /api/auth/logout-all</span>
                </div>

                <form id="passwordForm" class="form" novalidate>
                    <label class="field">
                        <span class="field-label">Текущий пароль</span>
                        <input class="control" type="password" name="current_password" required autocomplete="current-password">
                    </label>

                    <label class="field">
                        <span class="field-label">Новый пароль</span>
                        <input class="control" type="password" name="new_password" required minlength="8" maxlength="200" autocomplete="new-password">
                        <span class="helper">Минимум 8 символов. После смены все остальные устройства разлогинятся, это останется только вы.</span>
                    </label>

                    <label class="field">
                        <span class="field-label">Повторите новый пароль</span>
                        <input class="control" type="password" name="repeat_password" required minlength="8" maxlength="200" autocomplete="new-password">
                    </label>

                    <div class="form-actions">
                        <button type="submit" class="btn">Изменить пароль</button>
                        <button id="logoutAllBtn" type="button" class="btn btn-secondary">Выйти везде</button>
                    </div>

                    <p id="passwordMessage" class="message hidden" role="status"></p>
                </form>
            </section>
        </div>
    </main>

    <footer class="site-footer"></footer>

    <!-- Модальное окно заданий: содержимое рендерит js/modals.js -->
    <div id="modalContainer" class="modal-overlay hidden">
        <div id="modalDialog" class="modal-content" role="dialog" aria-modal="true"
             aria-labelledby="modalTitle" tabindex="-1">
            <div class="modal-header">
                <h2 id="modalTitle" class="modal-title">Задания</h2>
                <button id="modalCloseBtn" class="modal-close" type="button" aria-label="Закрыть окно">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
                </button>
            </div>
            <div id="modalBody"></div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/core/api-client.js"></script>
    <script src="js/core/format.js"></script>
    <script src="js/core/layout.js"></script>
    <script src="js/common.js"></script>
    <script src="js/modals.js"></script>
    <script src="js/dashboard.js"></script>
    <script src="js/account.js"></script>
</body>
</html>
