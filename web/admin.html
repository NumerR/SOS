<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Администрирование · SOS</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <header class="site-header">
        <div class="container header-row">
            <a href="/" class="brand">
                <span class="brand-mark" aria-hidden="true">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></svg>
                </span>
                <span class="brand-text">
                    <span class="brand-title">SOS</span>
                    <span class="brand-sub">Администрирование</span>
                </span>
            </a>

            <div class="top-actions">
                <a href="/dashboard" class="btn btn-secondary">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
                    В кабинет
                </a>
                <button id="logoutBtn" class="btn btn-secondary">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg>
                    Выйти
                </button>
            </div>
        </div>
    </header>

    <main class="main">
        <div class="container stack">
            <section class="section">
                <div class="section-head">
                    <span class="section-label"><span class="section-index">01</span> Пользователи</span>
                    <span class="section-rule"></span>
                    <button id="refreshBtn" class="btn btn-icon" title="Обновить список" aria-label="Обновить список">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
                    </button>
                </div>

                <div class="panel" style="padding:0; overflow:hidden;">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Логин</th>
                                <th>Email</th>
                                <th>Имя</th>
                                <th>Роль</th>
                            </tr>
                        </thead>
                        <tbody id="usersBody">
                            <tr>
                                <td colspan="5">
                                    <div class="empty-state" style="border:0; box-shadow:none; background:transparent;">
                                        <span class="spinner" aria-hidden="true"></span>
                                        <span class="empty-hint">Загрузка пользователей…</span>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </div>
    </main>

    <footer class="site-footer">
        <div class="container footer-row">
            <span class="footer-meta">RequireRole · admin only</span>
            <div class="swatches" aria-hidden="true">
                <span class="swatch parchment"></span>
                <span class="swatch surface"></span>
                <span class="swatch line"></span>
                <span class="swatch teal"></span>
                <span class="swatch ink"></span>
            </div>
            <span class="footer-meta">Go · SQLite · Vanilla JS</span>
        </div>
    </footer>

    <script src="/js/common.js"></script>
    <script src="/js/admin.js"></script>
</body>
</html>
